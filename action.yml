name: "CiteReady — AI Search (llms.txt / GEO) & Schema.org Audit"
author: "OmniForge Studio"
description: "Audit OAI-SearchBot, PerplexityBot & ClaudeBot robots.txt rules, /llms.txt specs, and Schema.org JSON-LD in CI/CD."

branding:
  icon: "search"
  color: "purple"

inputs:
  url:
    description: "Live URL or preview deployment URL to audit (e.g. https://yoursite.com)"
    required: true
  min-score:
    description: "Minimum GEO Visibility Score (0-100) before failing the CI step (default: 0 = report only)"
    required: false
    default: "0"
  require-llms-txt:
    description: "Set to 'true' to fail the check if a spec-compliant /llms.txt is missing"
    required: false
    default: "false"
  require-jsonld:
    description: "Set to 'true' to fail the check if valid Schema.org JSON-LD structured data is missing"
    required: false
    default: "false"

outputs:
  score:
    description: "Computed GEO & Technical SEO Visibility Score (0-100)"
    value: ${{ steps.audit.outputs.score }}
  grade:
    description: "Visibility letter grade (A, B, C, or D)"
    value: ${{ steps.audit.outputs.grade }}
  llms-txt-present:
    description: "Whether a spec-compliant /llms.txt was detected ('true' or 'false')"
    value: ${{ steps.audit.outputs.llms-txt-present }}
  jsonld-count:
    description: "Number of parsed Schema.org JSON-LD blocks on the page"
    value: ${{ steps.audit.outputs.jsonld-count }}
  json:
    description: "Full structured JSON audit report"
    value: ${{ steps.audit.outputs.json }}

runs:
  using: "composite"
  steps:
    - name: Run CiteReady AI Search (GEO) & Schema.org Audit
      id: audit
      shell: bash
      env:
        INPUT_URL: ${{ inputs.url }}
        INPUT_MIN_SCORE: ${{ inputs.min-score }}
        INPUT_REQ_LLMS: ${{ inputs.require-llms-txt }}
        INPUT_REQ_JSONLD: ${{ inputs.require-jsonld }}
      run: |
        EXTRA_FLAGS=()
        if [ -n "${INPUT_MIN_SCORE}" ] && [ "${INPUT_MIN_SCORE}" != "0" ]; then
          EXTRA_FLAGS+=(--min-score "${INPUT_MIN_SCORE}")
        fi
        if [ "${INPUT_REQ_LLMS}" = "true" ]; then
          EXTRA_FLAGS+=(--require-llms-txt)
        fi
        if [ "${INPUT_REQ_JSONLD}" = "true" ]; then
          EXTRA_FLAGS+=(--require-jsonld)
        fi
        node "${{ github.action_path }}/bin/citeready.mjs" check "${INPUT_URL}" \
          --summary-file "${GITHUB_STEP_SUMMARY}" \
          --github-output "${GITHUB_OUTPUT}" \
          "${EXTRA_FLAGS[@]}"
